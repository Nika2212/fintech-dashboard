name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run wasm:coverage
      - run: npm run test:coverage

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -- --base-href "/${{ github.event.repository.name }}/"
      - name: Serve index.html for deep links
        run: cp dist/fintech-dashboard/browser/index.html dist/fintech-dashboard/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/fintech-dashboard/browser
      - id: deployment
        uses: actions/deploy-pages@v4
